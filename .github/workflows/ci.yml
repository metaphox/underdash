name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: src/go.sum
      - name: go vet
        run: cd src && go vet ./...
      - name: go test
        run: cd src && go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: src/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: src
          version: latest
