version: 2

project_name: underdash

builds:
  - dir: src
    main: .
    binary: underdash
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X metaphox/underdash/cmd.version={{.Version}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"
